<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | KasiEats</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#f8f8f8;
color:#333;
}

.hero{
background:#ff6b00;
padding:70px 20px;
text-align:center;
color:white;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:40px;
margin-top:-30px;
border-radius:20px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
background:#ff6b00;
color:white;
border:none;
padding:15px 35px;
border-radius:10px;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

.info{
margin-top:40px;
line-height:2;
}

a{
color:#ff6b00;
text-decoration:none;
}

</style>

</head>

<body>

<div class="hero">

<h1>Contact KasiEats</h1>

<p>We would love to hear from you.</p>

</div>

<div class="container">

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<textarea rows="6" placeholder="Your Message"></textarea>

<button type="submit">

Send Message

</button>

</form>

<div class="info">

<h2>Business Information</h2>

<p>📍 Pretoria, Gauteng, South Africa</p>

<p>📧 yourname@gmail.com</p>

<p>🕒 Monday - Sunday | 08:00 - 22:00</p>

</div>

<p>

<a href="index.html">← Back Home</a>

</p>

</div>

</body>

</html>
